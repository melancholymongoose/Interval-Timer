<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#eef1f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1417" media="(prefers-color-scheme: dark)">
<title>Interval Timer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap"></noscript>
<style>
  :root{
    --bg:#eef1f4;
    --stage:#ffffff;
    --panel:#ffffff;
    --panel-line:#dde3e8;
    --text:#141a1f;
    --text-dim:#5c6873;
    --work:#c97a00;
    --work-soft:#fbeed9;
    --rest:#1f8fa3;
    --rest-soft:#e0f2f5;
    --ready:#5c6873;
    --ready-soft:#eef1f4;
    --done:#1f9d55;
    --done-soft:#e3f7ea;
    --track:#e2e7eb;
    --shadow:0 1px 2px rgba(20,26,31,0.06), 0 8px 24px rgba(20,26,31,0.06);
    --focus:#1f6fa3;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0f1417;
      --stage:#0f1417;
      --panel:#161d22;
      --panel-line:#26313a;
      --text:#eef3f6;
      --text-dim:#8b98a3;
      --work:#f5a623;
      --work-soft:#2b2110;
      --rest:#4fd1e0;
      --rest-soft:#0f2a2e;
      --ready:#9aa7b1;
      --ready-soft:#161d22;
      --done:#4ee08a;
      --done-soft:#0f2a1c;
      --track:#232c33;
      --shadow:0 1px 2px rgba(0,0,0,0.3), 0 8px 28px rgba(0,0,0,0.35);
      --focus:#4fd1e0;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0f1417;
    --stage:#0f1417;
    --panel:#161d22;
    --panel-line:#26313a;
    --text:#eef3f6;
    --text-dim:#8b98a3;
    --work:#f5a623;
    --work-soft:#2b2110;
    --rest:#4fd1e0;
    --rest-soft:#0f2a2e;
    --ready:#9aa7b1;
    --ready-soft:#161d22;
    --done:#4ee08a;
    --done-soft:#0f2a1c;
    --track:#232c33;
    --shadow:0 1px 2px rgba(0,0,0,0.3), 0 8px 28px rgba(0,0,0,0.35);
    --focus:#4fd1e0;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; overscroll-behavior:none; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'IBM Plex Sans', system-ui, -apple-system, sans-serif;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    overflow-x:hidden;
  }
  .app{
    flex:1;
    display:flex;
    flex-direction:column;
    max-width:460px;
    width:100%;
    margin:0 auto;
    padding:max(14px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    gap:12px;
  }

  button{ touch-action:manipulation; -webkit-touch-callout:none; user-select:none; }

  /* header */
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .title{
    font-family:'Space Grotesk', -apple-system, system-ui, sans-serif;
    font-weight:600;
    font-size:15px;
    letter-spacing:.01em;
    color:var(--text-dim);
    margin:0;
  }
  .icon-btn{
    appearance:none;
    border:1px solid var(--panel-line);
    background:var(--panel);
    color:var(--text-dim);
    width:40px;
    height:40px;
    border-radius:11px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:background .15s ease, color .15s ease, transform .1s ease;
  }
  .icon-btn:hover{ color:var(--text); background:var(--track); }
  .icon-btn:active{ transform:scale(0.94); }
  .icon-btn svg{ width:18px; height:18px; }

  /* settings */
  details.settings{
    background:var(--panel);
    border:1px solid var(--panel-line);
    border-radius:14px;
    padding:2px 14px;
  }
  details.settings > summary{
    list-style:none;
    cursor:pointer;
    padding:12px 0;
    font-weight:600;
    font-size:14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    color:var(--text);
  }
  details.settings > summary::-webkit-details-marker{ display:none; }
  .chev{ transition:transform .18s ease; color:var(--text-dim); }
  details[open] .chev{ transform:rotate(180deg); }
  .settings-body{
    padding:2px 0 16px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .field{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
  }
  .field label{
    font-size:14px;
    color:var(--text-dim);
  }
  .field-note{
    font-size:12px;
    color:var(--text-dim);
    margin-top:-8px;
  }
  .stepper{
    display:flex;
    align-items:center;
    border:1px solid var(--panel-line);
    border-radius:10px;
    overflow:hidden;
    flex-shrink:0;
  }
  .step-btn{
    appearance:none;
    border:none;
    background:transparent;
    color:var(--text);
    width:38px;
    height:38px;
    font-size:18px;
    line-height:1;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .step-btn:hover{ background:var(--track); }
  .step-btn:active{ background:var(--panel-line); }
  .step-btn:disabled{ opacity:.35; cursor:not-allowed; }
  .stepper input{
    width:52px;
    text-align:center;
    border:none;
    border-left:1px solid var(--panel-line);
    border-right:1px solid var(--panel-line);
    background:transparent;
    color:var(--text);
    font-family:'Space Grotesk', -apple-system, system-ui, sans-serif;
    font-weight:600;
    font-size:16px;
    height:38px;
    -moz-appearance:textfield;
  }
  .stepper input::-webkit-outer-spin-button,
  .stepper input::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
  .stepper input:disabled{ color:var(--text-dim); }
  fieldset{ border:none; margin:0; padding:0; display:contents; }
  fieldset:disabled{ opacity:.55; }

  /* volume row, always visible */
  .volume-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:0 2px;
  }
  .volume-row svg{ flex-shrink:0; color:var(--text-dim); width:18px; height:18px; }
  input[type="range"]{
    -webkit-appearance:none;
    appearance:none;
    flex:1;
    height:4px;
    border-radius:2px;
    background:var(--track);
    outline:none;
  }
  input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:20px;
    height:20px;
    border-radius:50%;
    background:var(--text);
    cursor:pointer;
    border:3px solid var(--stage);
    box-shadow:0 0 0 1px var(--panel-line);
  }
  input[type="range"]::-moz-range-thumb{
    width:20px;
    height:20px;
    border-radius:50%;
    background:var(--text);
    cursor:pointer;
    border:3px solid var(--stage);
    box-shadow:0 0 0 1px var(--panel-line);
  }
  .volume-val{
    font-family:'Space Grotesk', -apple-system, system-ui, sans-serif;
    font-size:13px;
    font-weight:600;
    color:var(--text-dim);
    width:34px;
    text-align:right;
    flex-shrink:0;
  }

  /* dots */
  .dots{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    justify-content:center;
    padding:2px 4px;
    min-height:10px;
  }
  .dot{
    width:8px;
    height:8px;
    border-radius:50%;
    background:var(--track);
    transition:background .2s ease, transform .2s ease;
  }
  .dot.complete{ background:var(--text-dim); }
  .dot.current{ background:var(--work); transform:scale(1.35); }
  .dot.current.rest-phase{ background:var(--rest); }
  .bar-track{
    height:6px;
    border-radius:3px;
    background:var(--track);
    overflow:hidden;
  }
  .bar-fill{
    height:100%;
    background:var(--work);
    border-radius:3px;
    transition:width .25s ease, background .25s ease;
  }
  .bar-fill.rest-phase{ background:var(--rest); }
  .bar-label{
    text-align:center;
    font-size:12px;
    color:var(--text-dim);
    margin-top:6px;
  }

  /* stage */
  .stage{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:6px;
    padding:6px 0;
    min-height:0;
  }
  .phase{
    font-family:'Space Grotesk', -apple-system, system-ui, sans-serif;
    font-weight:700;
    font-size:clamp(18px, 5.5vw, 26px);
    letter-spacing:.03em;
    padding:5px 18px;
    border-radius:999px;
    background:var(--ready-soft);
    color:var(--ready);
    transition:background .25s ease, color .25s ease;
  }
  .phase.work{ background:var(--work-soft); color:var(--work); }
  .phase.rest{ background:var(--rest-soft); color:var(--rest); }
  .phase.done{ background:var(--done-soft); color:var(--done); }

  .ring-wrap{
    position:relative;
    width:min(62vw, 270px);
    height:min(62vw, 270px);
    display:flex;
    align-items:center;
    justify-content:center;
    margin:4px 0;
    flex-shrink:1;
  }
  .ring-wrap svg{ width:100%; height:100%; transform:rotate(-90deg); }
  .ring-track{ fill:none; stroke:var(--track); stroke-width:5; }
  .ring-fill{
    fill:none;
    stroke:var(--work);
    stroke-width:5;
    stroke-linecap:round;
    transition:stroke-dashoffset .18s linear, stroke .25s ease;
  }
  .ring-fill.rest-phase{ stroke:var(--rest); }
  .ring-fill.done-phase{ stroke:var(--done); }
  .clock{
    position:absolute;
    font-family:'Space Grotesk', -apple-system, system-ui, sans-serif;
    font-weight:700;
    font-size:clamp(40px, 13vw, 62px);
    font-variant-numeric:tabular-nums;
    letter-spacing:.01em;
    color:var(--text);
  }
  .set-info{
    font-size:14px;
    color:var(--text-dim);
    text-align:center;
  }
  .set-info strong{ color:var(--text); font-weight:600; }

  /* controls */
  .controls{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:clamp(12px, 4vw, 24px);
    padding:6px 0 2px;
  }
  .side-btn{
    appearance:none;
    border:1px solid var(--panel-line);
    background:var(--panel);
    color:var(--text);
    width:60px;
    height:60px;
    border-radius:50%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:3px;
    cursor:pointer;
    box-shadow:var(--shadow);
    transition:transform .1s ease, background .15s ease;
    flex-shrink:0;
  }
  .side-btn svg{ width:19px; height:19px; }
  .side-btn span{ font-size:10px; color:var(--text-dim); font-weight:500; }
  .side-btn:hover{ background:var(--track); }
  .side-btn:active{ transform:scale(0.93); }
  .side-btn:disabled{ opacity:.4; cursor:not-allowed; transform:none; }

  .mega-btn{
    position:relative;
    appearance:none;
    border:none;
    width:clamp(112px, 32vw, 156px);
    height:clamp(112px, 32vw, 156px);
    border-radius:50%;
    background:var(--ready);
    color:var(--stage);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    box-shadow:0 10px 30px rgba(0,0,0,0.18);
    transition:background .2s ease, transform .08s ease;
    flex-shrink:0;
  }
  .mega-btn.work{ background:var(--work); }
  .mega-btn.rest{ background:var(--rest); }
  .mega-btn.done{ background:var(--done); }
  .mega-btn:active{ transform:scale(0.96); }
  .mega-icon{
    position:absolute;
    width:42%;
    height:42%;
    display:none;
  }
  .mega-btn[data-state="idle"] .icon-play{ display:block; }
  .mega-btn[data-state="running"] .icon-pause{ display:block; }
  .mega-btn[data-state="done"] .icon-restart{ display:block; }

  .reset-row{
    display:flex;
    justify-content:center;
    padding-top:2px;
    min-height:28px;
  }
  .text-btn{
    appearance:none;
    border:none;
    background:none;
    color:var(--text-dim);
    font-size:13px;
    font-family:inherit;
    cursor:pointer;
    padding:6px 10px;
    text-decoration:underline;
    text-underline-offset:3px;
    text-decoration-color:var(--panel-line);
  }
  .text-btn:hover{ color:var(--text); }

  :focus-visible{
    outline:2px solid var(--focus);
    outline-offset:2px;
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition-duration:0.001ms !important; }
  }

  @media (max-height: 700px){
    .app{ gap:8px; }
    .ring-wrap{ width:min(50vw, 220px); height:min(50vw, 220px); }
  }
</style>
</head>
<body>
<audio id="silentKick" preload="auto" playsinline style="display:none" src="data:audio/wav;base64,UklGRoQJAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YWAJAACAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgIA="></audio>
<div class="app">

  <header>
    <p class="title">Interval Timer</p>
    <button class="icon-btn" id="resetBtn" type="button" aria-label="Reset workout" title="Reset workout">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 1 3 6.7"/><path d="M3 4v5h5"/></svg>
    </button>
  </header>

  <details class="settings" id="settingsPanel" open>
    <summary>
      Workout settings
      <svg class="chev" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
    </summary>
    <fieldset id="settingsFields" class="settings-body">
      <div class="field">
        <label for="setsInput">Sets</label>
        <div class="stepper">
          <button type="button" class="step-btn" data-target="sets" data-dir="-1" aria-label="Fewer sets">−</button>
          <input type="number" id="setsInput" inputmode="numeric" min="1" max="50" value="8">
          <button type="button" class="step-btn" data-target="sets" data-dir="1" aria-label="More sets">+</button>
        </div>
      </div>
      <div class="field">
        <label for="workInput">Work (sec)</label>
        <div class="stepper">
          <button type="button" class="step-btn" data-target="work" data-dir="-5" aria-label="Shorter work interval">−</button>
          <input type="number" id="workInput" inputmode="numeric" min="5" max="600" step="5" value="30">
          <button type="button" class="step-btn" data-target="work" data-dir="5" aria-label="Longer work interval">+</button>
        </div>
      </div>
      <div class="field">
        <label for="restInput">Rest (sec)</label>
        <div class="stepper">
          <button type="button" class="step-btn" data-target="rest" data-dir="-5" aria-label="Shorter rest, 0 turns rest off">−</button>
          <input type="number" id="restInput" inputmode="numeric" min="0" max="300" step="5" value="15">
          <button type="button" class="step-btn" data-target="rest" data-dir="5" aria-label="Longer rest">+</button>
        </div>
      </div>
      <p class="field-note" id="restNote">0 seconds turns rest off — sets run back to back.</p>
    </fieldset>
  </details>

  <div class="volume-row">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
    <input type="range" id="volumeInput" min="0" max="100" value="70" aria-label="Beep volume">
    <span class="volume-val" id="volumeVal">70%</span>
  </div>

  <div id="dotsWrap">
    <div class="dots" id="dots"></div>
  </div>

  <main class="stage">
    <div class="phase" id="phaseLabel">READY</div>
    <div class="ring-wrap">
      <svg viewBox="0 0 200 200">
        <circle class="ring-track" cx="100" cy="100" r="90"></circle>
        <circle class="ring-fill" id="ringFill" cx="100" cy="100" r="90"></circle>
      </svg>
      <div class="clock" id="clock">0:30</div>
    </div>
    <p class="set-info" id="setInfo">Set <strong>1</strong> of <strong>8</strong></p>
  </main>

  <div class="controls">
    <button class="side-btn" id="prevBtn" type="button" aria-label="Restart current interval">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 19 2 12l9-7v14Z"/><path d="M22 19 13 12l9-7v14Z"/></svg>
      <span>Restart</span>
    </button>

    <button class="mega-btn" id="pauseBtn" type="button" aria-label="Start workout" data-state="idle">
      <svg class="mega-icon icon-play" viewBox="0 0 24 24" fill="currentColor"><polygon points="8,5 19,12 8,19"></polygon></svg>
      <svg class="mega-icon icon-pause" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"></rect><rect x="14" y="5" width="4" height="14" rx="1"></rect></svg>
      <svg class="mega-icon icon-restart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 1 3 6.7"/><path d="M3 4v5h5"/></svg>
    </button>

    <button class="side-btn" id="nextBtn" type="button" aria-label="Skip to next interval">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m13 19 9-7-9-7v14Z"/><path d="M2 19 11 12 2 5v14Z"/></svg>
      <span>Skip</span>
    </button>
  </div>

  <div class="reset-row">
    <button class="text-btn" id="startOverBtn" type="button" hidden>Start over</button>
  </div>

</div>

<script>
(function(){
  "use strict";

  // ---------- persisted settings ----------
  var STORE_KEY = "intervalTimerSettings.v1";
  function loadSettings(){
    try{
      var raw = localStorage.getItem(STORE_KEY);
      if(!raw) return null;
      var parsed = JSON.parse(raw);
      if(typeof parsed !== "object" || parsed === null) return null;
      return parsed;
    }catch(e){ return null; }
  }
  function saveSettings(){
    try{
      localStorage.setItem(STORE_KEY, JSON.stringify({
        sets: settings.sets, work: settings.work, rest: settings.rest, volume: settings.volume
      }));
    }catch(e){ /* storage unavailable, ignore */ }
  }

  var saved = loadSettings();
  var settings = {
    sets: (saved && saved.sets) || 8,
    work: (saved && saved.work) || 30,
    rest: (saved && saved.rest !== undefined) ? saved.rest : 15,
    volume: (saved && saved.volume !== undefined) ? saved.volume : 70
  };

  // ---------- elements ----------
  var els = {
    setsInput: document.getElementById("setsInput"),
    workInput: document.getElementById("workInput"),
    restInput: document.getElementById("restInput"),
    volumeInput: document.getElementById("volumeInput"),
    volumeVal: document.getElementById("volumeVal"),
    settingsFields: document.getElementById("settingsFields"),
    settingsPanel: document.getElementById("settingsPanel"),
    dotsWrap: document.getElementById("dotsWrap"),
    phaseLabel: document.getElementById("phaseLabel"),
    clock: document.getElementById("clock"),
    ringFill: document.getElementById("ringFill"),
    setInfo: document.getElementById("setInfo"),
    prevBtn: document.getElementById("prevBtn"),
    nextBtn: document.getElementById("nextBtn"),
    pauseBtn: document.getElementById("pauseBtn"),
    resetBtn: document.getElementById("resetBtn")
  };

  els.setsInput.value = settings.sets;
  els.workInput.value = settings.work;
  els.restInput.value = settings.rest;
  els.volumeInput.value = settings.volume;
  els.volumeVal.textContent = settings.volume + "%";

  // ---------- audio ----------
  var audioCtx = null;
  function ensureAudio(){
    try{
      if(!audioCtx){
        var Ctx = window.AudioContext || window.webkitAudioContext;
        if(!Ctx) return null;
        audioCtx = new Ctx();
      }
      if(audioCtx.state === "suspended") audioCtx.resume();
      return audioCtx;
    }catch(e){ return null; }
  }

  function tone(freq, duration, type, gainMult, when){
    var ctx = ensureAudio();
    if(!ctx) return;
    try{
      var startTime = ctx.currentTime + (when || 0);
      var vol = (settings.volume / 100) * (gainMult === undefined ? 1 : gainMult);
      if(vol <= 0) return;
      var osc = ctx.createOscillator();
      var g = ctx.createGain();
      osc.type = type || "sine";
      osc.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, startTime);
      g.gain.linearRampToValueAtTime(vol, startTime + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);
      osc.connect(g);
      g.connect(ctx.destination);
      osc.start(startTime);
      osc.stop(startTime + duration + 0.03);
    }catch(e){ /* ignore audio errors */ }
  }

  // Playing a real (silent) HTML5 <audio> element on the first touch nudges iOS Safari's
  // audio session into a mode where Web Audio tones keep playing even with the mute switch
  // on. This is a documented WebKit quirk, not a guarantee — some iOS versions still mute
  // web audio regardless, since there's no public API for a page to fully override the switch.
  var audioKicked = false;
  function kickAudioSession(){
    if(audioKicked) return;
    audioKicked = true;
    try{
      var el = document.getElementById("silentKick");
      if(el){ var p = el.play(); if(p && p.catch) p.catch(function(){}); }
    }catch(e){}
  }
  document.addEventListener("touchstart", kickAudioSession, { once: true, passive: true });
  document.addEventListener("mousedown", kickAudioSession, { once: true });

  function playWarningBeep(){ tone(740, 0.09, "sine", 0.85); }
  function playTransitionBeep(){ tone(880, 0.09, "square", 0.9); tone(1320, 0.16, "square", 0.9, 0.11); }
  function playCompletionFanfare(){ tone(523, 0.15, "sine", 1, 0); tone(659, 0.15, "sine", 1, 0.15); tone(784, 0.28, "sine", 1, 0.3); }
  function playClickTick(){ tone(600, 0.045, "sine", 0.4); }

  // ---------- wake lock ----------
  var wakeLock = null;
  function requestWakeLock(){
    try{
      if("wakeLock" in navigator){
        navigator.wakeLock.request("screen").then(function(lock){ wakeLock = lock; }).catch(function(){});
      }
    }catch(e){}
  }
  function releaseWakeLock(){
    try{ if(wakeLock){ wakeLock.release().catch(function(){}); wakeLock = null; } }catch(e){}
  }
  document.addEventListener("visibilitychange", function(){
    if(document.visibilityState === "visible" && state.running) requestWakeLock();
  });

  // ---------- state machine ----------
  var state = {
    segments: [],
    segIndex: 0,
    remainingMs: 0,
    running: false,
    started: false,
    done: false,
    segmentEndTime: 0,
    beepFired: {},
    intervalId: null
  };

  function buildSegments(){
    var segs = [];
    for(var i = 1; i <= settings.sets; i++){
      segs.push({ type: "work", set: i, duration: settings.work });
      if(i < settings.sets && settings.rest > 0){
        segs.push({ type: "rest", set: i, duration: settings.rest });
      }
    }
    return segs;
  }

  function loadSegment(index){
    state.segIndex = index;
    var seg = state.segments[index];
    state.remainingMs = seg.duration * 1000;
    state.beepFired = {};
    if(state.running){
      state.segmentEndTime = performance.now() + state.remainingMs;
    }
  }

  function resetWorkout(){
    stopTicking();
    releaseWakeLock();
    state.segments = buildSegments();
    state.running = false;
    state.started = false;
    state.done = false;
    loadSegment(0);
    setSettingsLocked(false);
    renderFull();
  }

  function setSettingsLocked(locked){
    els.settingsFields.disabled = locked;
  }

  function startTicking(){
    stopTicking();
    state.intervalId = setInterval(tick, 100);
  }
  function stopTicking(){
    if(state.intervalId){ clearInterval(state.intervalId); state.intervalId = null; }
  }

  function tick(){
    if(!state.running) return;
    var now = performance.now();
    var remaining = state.segmentEndTime - now;
    if(remaining <= 0){
      completeSegment();
      return;
    }
    state.remainingMs = remaining;
    checkBeeps(remaining);
    renderClock();
  }

  function checkBeeps(remainingMs){
    var thresholds = [3000, 2000, 1000];
    for(var i = 0; i < thresholds.length; i++){
      var th = thresholds[i];
      if(remainingMs <= th && !state.beepFired[th]){
        state.beepFired[th] = true;
        playWarningBeep();
      }
    }
  }

  function completeSegment(){
    var isLast = state.segIndex >= state.segments.length - 1;
    if(isLast){
      finishWorkout(true);
      return;
    }
    playTransitionBeep();
    loadSegment(state.segIndex + 1);
    renderFull();
  }

  function finishWorkout(playSound){
    stopTicking();
    releaseWakeLock();
    state.running = false;
    state.done = true;
    if(playSound) playCompletionFanfare();
    renderFull();
  }

  function onTogglePause(){
    ensureAudio();
    if(state.done){
      resetWorkout();
      return;
    }
    var wasOpen = els.settingsPanel.open;
    state.started = true;
    setSettingsLocked(true);
    if(wasOpen) els.settingsPanel.open = false;
    state.running = !state.running;
    if(state.running){
      state.segmentEndTime = performance.now() + state.remainingMs;
      startTicking();
      requestWakeLock();
    } else {
      stopTicking();
      releaseWakeLock();
    }
    renderFull();
  }

  function onNext(){
    ensureAudio();
    if(state.done) return;
    playClickTick();
    if(state.segIndex >= state.segments.length - 1){
      finishWorkout(state.running);
      return;
    }
    loadSegment(state.segIndex + 1);
    renderFull();
  }

  function onPrev(){
    ensureAudio();
    if(state.done) return;
    playClickTick();
    loadSegment(state.segIndex);
    renderFull();
  }

  // ---------- rendering ----------
  var RING_CIRC = 2 * Math.PI * 90;
  els.ringFill.style.strokeDasharray = String(RING_CIRC);

  function formatTime(ms){
    var totalSec = Math.max(0, Math.ceil(ms / 1000));
    var m = Math.floor(totalSec / 60);
    var s = totalSec % 60;
    return m + ":" + (s < 10 ? "0" : "") + s;
  }

  function currentSetNumber(){
    if(!state.segments.length) return 1;
    return state.segments[state.segIndex].set;
  }

  // lightweight update called every 100ms while running: clock text + ring only
  function renderClock(){
    var seg = state.segments[state.segIndex];
    els.clock.textContent = formatTime(state.remainingMs);
    var fraction = seg ? 1 - (state.remainingMs / (seg.duration * 1000)) : 0;
    fraction = Math.min(1, Math.max(0, fraction));
    els.ringFill.style.strokeDashoffset = String(RING_CIRC * (1 - fraction));
  }

  // full update: called on any state transition (start/pause/next/prev/reset/segment change)
  function renderFull(){
    var seg = state.segments[state.segIndex];

    var label = state.done ? "DONE" : (seg.type === "work" ? "WORK" : "REST");
    if(!state.started && !state.done) label = "READY";
    els.phaseLabel.textContent = label;
    els.phaseLabel.className = "phase " + (state.done ? "done" : (!state.started ? "" : seg.type));

    els.clock.textContent = state.done ? "DONE" : formatTime(state.remainingMs);

    var fraction = state.done ? 1 : (seg ? 1 - (state.remainingMs / (seg.duration * 1000)) : 0);
    fraction = Math.min(1, Math.max(0, fraction));
    els.ringFill.style.strokeDashoffset = String(RING_CIRC * (1 - fraction));
    els.ringFill.className = "ring-fill" + (state.done ? " done-phase" : (seg && seg.type === "rest" ? " rest-phase" : ""));

    var setNum = currentSetNumber();
    els.setInfo.innerHTML = state.done
      ? "Workout complete — <strong>" + settings.sets + "</strong> sets done"
      : "Set <strong>" + setNum + "</strong> of <strong>" + settings.sets + "</strong>" + (seg && seg.type === "rest" ? " — resting" : "");

    var megaState = state.done ? "done" : (state.running ? "running" : "idle");
    els.pauseBtn.dataset.state = megaState;
    els.pauseBtn.className = "mega-btn" + (state.done ? " done" : (state.started ? " " + seg.type : ""));
    els.pauseBtn.setAttribute("aria-label", state.done ? "Start over" : (state.running ? "Pause" : (state.started ? "Resume" : "Start workout")));

    els.prevBtn.disabled = state.done;
    els.nextBtn.disabled = state.done;

    renderDots();
  }

  function renderDots(){
    var n = settings.sets;
    var curSet = currentSetNumber();
    var curType = state.segments[state.segIndex] ? state.segments[state.segIndex].type : "work";

    if(n <= 24){
      var html = "";
      for(var i = 1; i <= n; i++){
        var cls = "dot";
        if(state.done || i < curSet) cls += " complete";
        else if(i === curSet && state.started) cls += " current" + (curType === "rest" ? " rest-phase" : "");
        html += '<span class="' + cls + '"></span>';
      }
      els.dotsWrap.innerHTML = '<div class="dots">' + html + '</div>';
    } else {
      var pct = state.done ? 100 : Math.round(((curSet - 1) / n) * 100);
      els.dotsWrap.innerHTML =
        '<div class="bar-track"><div class="bar-fill' + (curType === "rest" ? " rest-phase" : "") + '" style="width:' + pct + '%"></div></div>' +
        '<div class="bar-label">Set ' + curSet + ' of ' + n + '</div>';
    }
  }

  // ---------- settings wiring ----------
  function clamp(v, min, max){ return Math.min(max, Math.max(min, v)); }

  // live preview while typing/stepping — no clamping/write-back, just reflects valid input immediately
  function livePreviewSettings(){
    if(state.started) return;
    var s = parseInt(els.setsInput.value, 10);
    var w = parseInt(els.workInput.value, 10);
    var r = parseInt(els.restInput.value, 10);
    if(!isNaN(s) && s >= 1 && s <= 50) settings.sets = s;
    if(!isNaN(w) && w >= 5 && w <= 600) settings.work = w;
    if(!isNaN(r) && r >= 0 && r <= 300) settings.rest = r;
    state.segments = buildSegments();
    loadSegment(0);
    renderFull();
  }

  // final validation on blur / stepper press — clamps and writes back, persists
  function applySettingChange(){
    var s = clamp(parseInt(els.setsInput.value, 10) || 1, 1, 50);
    var w = clamp(parseInt(els.workInput.value, 10) || 5, 5, 600);
    var r = clamp(parseInt(els.restInput.value, 10) || 0, 0, 300);
    settings.sets = s; settings.work = w; settings.rest = r;
    els.setsInput.value = s; els.workInput.value = w; els.restInput.value = r;
    saveSettings();
    if(!state.started){
      state.segments = buildSegments();
      loadSegment(0);
      renderFull();
    }
  }

  els.setsInput.addEventListener("input", livePreviewSettings);
  els.workInput.addEventListener("input", livePreviewSettings);
  els.restInput.addEventListener("input", livePreviewSettings);
  els.setsInput.addEventListener("change", applySettingChange);
  els.workInput.addEventListener("change", applySettingChange);
  els.restInput.addEventListener("change", applySettingChange);

  document.querySelectorAll(".step-btn").forEach(function(btn){
    btn.addEventListener("click", function(){
      var target = btn.getAttribute("data-target");
      var dir = parseInt(btn.getAttribute("data-dir"), 10);
      var input = target === "sets" ? els.setsInput : target === "work" ? els.workInput : els.restInput;
      var min = parseInt(input.min, 10), max = parseInt(input.max, 10);
      var val = clamp((parseInt(input.value, 10) || 0) + dir, min, max);
      input.value = val;
      applySettingChange();
    });
  });

  els.volumeInput.addEventListener("input", function(){
    settings.volume = parseInt(els.volumeInput.value, 10);
    els.volumeVal.textContent = settings.volume + "%";
  });
  els.volumeInput.addEventListener("change", function(){
    saveSettings();
    ensureAudio();
    tone(880, 0.1, "sine", 1);
  });

  // ---------- control wiring ----------
  els.pauseBtn.addEventListener("click", onTogglePause);
  els.nextBtn.addEventListener("click", onNext);
  els.prevBtn.addEventListener("click", onPrev);
  els.resetBtn.addEventListener("click", resetWorkout);

  document.addEventListener("keydown", function(e){
    if(e.code === "Space"){ e.preventDefault(); onTogglePause(); }
    else if(e.code === "ArrowRight"){ onNext(); }
    else if(e.code === "ArrowLeft"){ onPrev(); }
  });

  // ---------- title updates while running (nice for background tabs) ----------
  setInterval(function(){
    if(state.running && !state.done){
      var seg = state.segments[state.segIndex];
      document.title = formatTime(state.remainingMs) + " · " + (seg.type === "work" ? "Work" : "Rest") + " — Interval Timer";
    } else if(state.done){
      document.title = "Done! — Interval Timer";
    } else {
      document.title = "Interval Timer";
    }
  }, 500);

  // ---------- init ----------
  resetWorkout();
})();
</script>
</body>
</html>
